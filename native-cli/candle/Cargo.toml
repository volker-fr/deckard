[package]
name = "ai_hider_candle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# "cuda" builds against candals's cudarc in dynamic-loading mode: the CUDA
# libraries are dlopened at runtime instead of linked, so no host CUDA toolkit
# is needed and a machine without an NVIDIA driver still runs (CPU fallback).
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "dep:cudarc"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]

[dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
# Direct cudarc dep enables "dynamic-loading", the dlopen mode. Feature
# unification applies it to the single cudarc instance shared with
# candle-core, whose own "dynamic-linking" flag was dropped via the vendored
# patch below (the two features are mutually exclusive in cudarc's build.rs
# and panic if both are set).
cudarc = { version = "0.19.9", default-features = false, optional = true, features = [
    "std",
    "cublas",
    "cublaslt",
    "curand",
    "driver",
    "nvrtc",
    "f16",
    "f8",
    "cuda-version-from-build-system",
    "dynamic-loading",
] }
serde_json = "1"

[patch.crates-io]
# Vendored candle-core 0.11.0 with "dynamic-linking" removed from its cudarc
# dependency so "dynamic-loading" can be active in the unified build.
candle-core = { path = "vendor/candle-core" }

[profile.release]
panic = "unwind"